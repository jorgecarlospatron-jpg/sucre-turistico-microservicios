<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sucre Turístico — Experiencias y actividades</title><link rel="stylesheet" href="styles.css"></head><body><div class="nav"><div class="brand">Golfo Sucre</div><div class="links"><a href="inicio.html">Inicio</a><a href="destinos.html">Destinos</a><a href="alojamientos.html">Hoteles</a><a href="gastronomia.html">Gastronomía</a><a href="experiencias.html" class="active">Experiencias</a><a href="eventos.html">Eventos</a><a href="buscador.html">Buscar</a></div><a href="admin-panel.html" class="cta">Panel Admin</a></div><section class="section"><div class="section-head"><h2>Experiencias y actividades</h2><span id="contador">Cargando...</span></div><div class="filters"><button class="chip active" data-filtro="Todos">Todas</button><button class="chip" data-filtro="Aventura">Aventura</button><button class="chip" data-filtro="Naturaleza">Naturaleza</button><button class="chip" data-filtro="Cultura">Cultura</button><button class="chip" data-filtro="Ecoturismo">Ecoturismo</button></div><div class="grid" id="contenido"><p>Cargando...</p></div></section><div class="footer">Sucre Turístico — Prototipo de interfaz · Electiva Profesional II</div><script>
const API="http://localhost:3000/api/experiencias"; let datos=[]; let filtro="Todos";
async function cargar(){try{const r=await fetch(API);if(!r.ok)throw new Error();datos=await r.json();mostrar();}catch(e){document.getElementById('contenido').innerHTML='<p>No se pudo conectar con el microservicio.</p>';}}
function img(x){return x.imagen||'https://www.tolucaribe.com/sites/default/files/13268537_10154165426387145_1458918189470704475_o.jpg';}
function mostrar(){let lista=filtro==='Todos'?datos:datos.filter(x=>(x.tipo||x.especialidad)==filtro);document.getElementById('contador').textContent=lista.length+' opciones encontradas';const c=document.getElementById('contenido');c.innerHTML='';if(!lista.length){c.innerHTML='<p>No hay resultados.</p>';return;}lista.forEach(x=>{const a=document.createElement('a');a.className='card';a.href='experiencia-detalle.html?id='+x.id;a.innerHTML=`<img src="${img(x)}" alt="${x.nombre}"><div class="body"><span class="tag">${x.tipo||"Experiencia"}</span><h3>${x.nombre}</h3><div class="meta">${x.municipio}</div><p>${x.descripcion||""}</p></div>`;c.appendChild(a);});}
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filtro=b.dataset.filtro;mostrar();}));cargar();
</script></body></html>
