<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sucre Turístico — Destinos</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="nav">
  <div class="brand">Golfo Sucre</div>

  <div class="links">
    <a href="inicio.html">Inicio</a>
    <a href="destinos.html" class="active">Destinos</a>
    <a href="alojamientos.html">Hoteles</a>
    <a href="gastronomia.html">Gastronomía</a>
    <a href="experiencias.html">Experiencias</a>
    <a href="eventos.html">Eventos</a>
    <a href="buscador.html">Buscar</a>
  </div>

  <a href="admin-panel.html" class="cta">Panel Admin</a>
</div>

<section class="section">

  <div class="section-head">
    <h2>Destinos del Golfo</h2>
    <span id="contador">Cargando destinos...</span>
  </div>

  <div class="filters">
    <div class="chip active" data-tipo="Todos">Todos</div>
    <div class="chip" data-tipo="Playa">Playas</div>
    <div class="chip" data-tipo="Islas">Islas</div>
    <div class="chip" data-tipo="Pueblos">Pueblos</div>
    <div class="chip" data-tipo="Naturaleza">Naturaleza</div>
  </div>

  <div class="grid" id="destinos-grid">
    <p>Cargando destinos...</p>
  </div>

</section>

<div class="footer">
  Sucre Turístico — Prototipo de interfaz · Electiva Profesional II
</div>

<script>

const API = "http://localhost:3000/api/destinos";

let destinos = [];

// Cargar destinos desde el microservicio
async function cargarDestinos() {

  try {

    const response = await fetch(API);

    if (!response.ok) {
      throw new Error("No se pudieron obtener los destinos");
    }

    destinos = await response.json();

    console.log("DESTINOS RECIBIDOS:", destinos);

    mostrarDestinos(destinos);

  } catch (error) {

    console.error("Error:", error);

    document.getElementById("destinos-grid").innerHTML = `
      <p>
        No se pudieron cargar los destinos.
        Verifica que el microservicio de destinos esté ejecutándose.
      </p>
    `;

  }

}


// Mostrar destinos
function mostrarDestinos(lista) {

  const grid = document.getElementById("destinos-grid");

  grid.innerHTML = "";

  document.getElementById("contador").textContent =
    `${lista.length} destinos encontrados`;

  if (lista.length === 0) {

    grid.innerHTML = "<p>No hay destinos disponibles.</p>";

    return;

  }

  lista.forEach(destino => {

    const tipo = destino.tipo || "Destino";

    const imagen = obtenerImagen(destino);

    grid.innerHTML += `

      <a
        class="card"
        href="destino-detalle.html?id=${destino.id}"
      >

        <img
          src="${imagen}"
          alt="${destino.nombre}"
        >

        <div class="body">

          <span class="tag">
            ${tipo}
          </span>

          <h3>
            ${destino.nombre}
          </h3>

          <div class="meta">
            ${destino.municipio}
          </div>

          <p>
            ${destino.descripcion || ""}
          </p>

        </div>

      </a>

    `;

  });

}


// Imágenes según el destino
function obtenerImagen(destino) {
  return destino.imagen || "https://www.tolucaribe.com/sites/default/files/13268537_10154165426387145_1458918189470704475_o.jpg";
}


// Filtros
document.querySelectorAll(".chip").forEach(chip => {

  chip.addEventListener("click", () => {

    document.querySelectorAll(".chip").forEach(c => {
      c.classList.remove("active");
    });

    chip.classList.add("active");

    const tipo = chip.dataset.tipo;

    if (tipo === "Todos") {

      mostrarDestinos(destinos);

    } else {

      const filtrados = destinos.filter(destino =>
        destino.tipo &&
        destino.tipo.toLowerCase() === tipo.toLowerCase()
      );

      mostrarDestinos(filtrados);

    }

  });

});


cargarDestinos();

</script>

</body>
</html>
