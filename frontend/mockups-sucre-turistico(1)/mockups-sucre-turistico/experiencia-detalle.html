<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sucre Turístico — Detalle</title><link rel="stylesheet" href="styles.css"></head><body><div class="nav"><div class="brand">Golfo Sucre</div><div class="links"><a href="inicio.html">Inicio</a><a href="destinos.html">Destinos</a><a href="alojamientos.html">Hoteles</a><a href="gastronomia.html">Gastronomía</a><a href="experiencias.html">Experiencias</a><a href="eventos.html">Eventos</a><a href="buscador.html">Buscar</a></div><a href="admin-panel.html" class="cta">Panel Admin</a></div><section class="section"><a href="experiencias.html" class="btn btn-outline">← Volver</a><div id="detalle" style="margin-top:25px"><p>Cargando información...</p></div></section><div class="footer">Sucre Turístico — Prototipo de interfaz · Electiva Profesional II</div><script>
const API='http://localhost:3004/api/experiencias'; const id=new URLSearchParams(location.search).get('id');
async function cargar(){const c=document.getElementById('detalle');if(!id){c.innerHTML='<h2>Registro no especificado</h2>';return;}try{const r=await fetch(`${API}/${id}`);if(!r.ok)throw new Error();const x=await r.json();c.innerHTML=`<div style="max-width:1000px;margin:auto"><img src="${x.imagen||'https://www.tolucaribe.com/sites/default/files/13268537_10154165426387145_1458918189470704475_o.jpg'}" alt="${x.nombre}" style="width:100%;max-height:500px;object-fit:cover;border-radius:15px"><div style="margin-top:25px"><span class="tag">${x.tipo||'Experiencia'}</span><h1 style="margin-top:12px;font-size:2.2rem">${x.nombre}</h1><div class="meta" style="margin-top:10px">📍 ${x.municipio}</div><p style="margin-top:20px;font-size:1.1rem;line-height:1.7">${x.descripcion||'Sin descripción disponible.'}</p><div style="margin-top:30px;padding:20px;border-radius:12px;background:#f5f5f5"><h3>Información</h3><p><strong>Nombre:</strong> ${x.nombre}</p><p><strong>Municipio:</strong> ${x.municipio}</p><p><strong>Tipo:</strong> ${x.tipo}</p></div></div></div>`;document.title='Sucre Turístico — '+x.nombre;}catch(e){c.innerHTML='<h2>No se pudo cargar la información</h2><p>Verifica que el microservicio correspondiente esté ejecutándose.</p>';}}cargar();
</script></body></html>
