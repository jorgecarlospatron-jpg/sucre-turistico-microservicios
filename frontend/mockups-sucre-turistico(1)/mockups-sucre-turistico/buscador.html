<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sucre Turístico — Buscador</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="nav">
  <div class="brand">Golfo Sucre</div>

  <div class="links">
    <a href="inicio.html">Inicio</a>
    <a href="destinos.html">Destinos</a>
    <a href="alojamientos.html">Hoteles</a>
    <a href="gastronomia.html">Gastronomía</a>
    <a href="experiencias.html">Experiencias</a>
    <a href="eventos.html">Eventos</a>
    <a href="buscador.html" class="active">Buscar</a>
  </div>

  <a href="admin-panel.html" class="cta">Panel Admin</a>
</div>


<section class="section" style="padding-bottom:0">

  <h2>Buscar en el Golfo</h2>

  <form
    id="form-busqueda"
    class="hero search-bar"
    style="padding:0;background:none;box-shadow:none;max-width:640px;margin:18px 0 0"
  >

    <input
      id="busqueda"
      type="text"
      placeholder="Destino, playa, hotel, restaurante..."
    >

    <button type="submit">
      Buscar
    </button>

  </form>


  <div class="filters" style="margin-top:20px">

    <button class="chip active" data-filtro="Todo">
      Todo
    </button>

    <button class="chip" data-filtro="Destinos">
      Destinos
    </button>

    <button class="chip" data-filtro="Hoteles">
      Hoteles
    </button>

    <button class="chip" data-filtro="Restaurantes">
      Restaurantes
    </button>

    <button class="chip" data-filtro="Experiencias">
      Experiencias
    </button>

    <button class="chip" data-filtro="Eventos">
      Eventos
    </button>

  </div>

</section>


<section class="section" style="padding-top:10px">

  <div class="section-head">
    <span id="contador">
      Escribe algo para buscar
    </span>
  </div>

  <div
    class="grid"
    id="resultados"
  ></div>

</section>


<div class="footer">
  Sucre Turístico — Prototipo de interfaz · Electiva Profesional II
</div>



<script>
const API_BUSCADOR = "http://localhost:3000/api/buscar";

let filtro = "Todo";

function extraerResultados(data) {
  let lista =
    data.resultados ||
    data.results ||
    data.data ||
    data.hits?.hits ||
    data.hits ||
    [];

  if (!Array.isArray(lista)) return [];

  return lista.map(item => item._source || item);
}

function obtenerCategoria(item) {
  const tipo = (item.tipo_contenido || item.categoria || "").toLowerCase();

  if (tipo.includes("destino")) return "Destinos";
  if (tipo.includes("alojamiento") || tipo.includes("hotel")) return "Hoteles";
  if (tipo.includes("gastronomia") || tipo.includes("restaurante")) return "Restaurantes";
  if (tipo.includes("experiencia")) return "Experiencias";
  if (tipo.includes("evento")) return "Eventos";

  return item.categoria || "Otros";
}

function obtenerImagen(item) {
  return item.imagen ||
    "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80";
}

async function ejecutarBusqueda() {
  const texto = document.getElementById("busqueda").value.trim();
  const contenedor = document.getElementById("resultados");
  const contador = document.getElementById("contador");

  if (!texto && filtro === "Todo") {
    contador.textContent = "Escribe algo para buscar";
    contenedor.innerHTML = "";
    return;
  }

  contador.textContent = "Buscando...";
  contenedor.innerHTML = "";

  try {
    const parametros = new URLSearchParams();

    if (texto) parametros.set("q", texto);

    const categorias = {
      "Destinos": "destinos",
      "Hoteles": "alojamientos",
      "Restaurantes": "gastronomia",
      "Experiencias": "experiencias",
      "Eventos": "eventos"
    };

    if (filtro !== "Todo") {
      parametros.set("tipo", categorias[filtro]);
    }

    const respuesta = await fetch(
      `${API_BUSCADOR}?${parametros.toString()}`
    );

    if (!respuesta.ok) {
      throw new Error("Error consultando Elasticsearch");
    }

    const data = await respuesta.json();
    let resultados = extraerResultados(data);

    // Filtrado adicional en pantalla
    if (filtro !== "Todo") {
      resultados = resultados.filter(
        item => obtenerCategoria(item) === filtro
      );
    }

    mostrarResultados(resultados);

  } catch (error) {
    console.error(error);
    contador.textContent = "No se pudo conectar con el buscador.";
  }
}

function mostrarResultados(resultados) {
  const contenedor = document.getElementById("resultados");
  const contador = document.getElementById("contador");

  contenedor.innerHTML = "";
  contador.textContent =
    `${resultados.length} resultado(s) encontrado(s)`;

  if (!resultados.length) {
    contenedor.innerHTML = `
      <div class="card">
        <div class="body">
          <h3>No se encontraron resultados</h3>
          <p>Prueba con otro nombre o municipio.</p>
        </div>
      </div>`;
    return;
  }

  resultados.forEach(item => {
   const tarjeta = document.createElement("a");
tarjeta.className = "card";
tarjeta.style.textDecoration = "none";
tarjeta.style.color = "inherit";

const categoria = obtenerCategoria(item);

const paginas = {
  "Destinos": "destino-detalle.html",
  "Hoteles": "alojamiento-detalle.html",
  "Restaurantes": "gastronomia-detalle.html",
  "Experiencias": "experiencia-detalle.html",
  "Eventos": "evento-detalle.html"
};

const pagina = paginas[categoria];

if (pagina && item.id) {
  tarjeta.href = `${pagina}?id=${encodeURIComponent(item.id)}`;
} else {
  tarjeta.href = "#";
}

    const imagen = document.createElement("img");
    imagen.src = obtenerImagen(item);
    imagen.alt = item.nombre || "Imagen turística";

    const cuerpo = document.createElement("div");
    cuerpo.className = "body";

    const etiqueta = document.createElement("span");
    etiqueta.className = "tag";
    etiqueta.textContent = obtenerCategoria(item);

    const titulo = document.createElement("h3");
    titulo.textContent = item.nombre || "Sin nombre";

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = item.municipio || "";

    const descripcion = document.createElement("p");
    descripcion.textContent = item.descripcion || "";

    cuerpo.append(etiqueta, titulo, meta, descripcion);
    tarjeta.append(imagen, cuerpo);
    contenedor.appendChild(tarjeta);
  });
}

document.getElementById("form-busqueda")
  .addEventListener("submit", event => {
    event.preventDefault();
    ejecutarBusqueda();
  });

document.getElementById("busqueda")
  .addEventListener("input", ejecutarBusqueda);

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".chip")
      .forEach(c => c.classList.remove("active"));

    chip.classList.add("active");
    filtro = chip.dataset.filtro;
    ejecutarBusqueda();
  });
});

// Recuperar búsqueda enviada desde inicio.html
const parametrosIniciales = new URLSearchParams(window.location.search);
const busquedaInicial = parametrosIniciales.get("q");

if (busquedaInicial) {
  document.getElementById("busqueda").value = busquedaInicial;
  ejecutarBusqueda();
}
</script>

</body>
</html>
